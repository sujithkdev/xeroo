<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline';"><title>Xeroo Desk</title><style>body{font:16px system-ui;margin:0;background:#f3f6fc;color:#14243b}main{padding:42px}h1{font-size:32px;margin:12px 0}p{line-height:1.6;color:#465872}label{display:block;margin-top:24px;font-weight:600}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #b8c5d6;border-radius:8px;margin-top:8px;font:inherit}button{background:#2459da;color:white;border:0;border-radius:8px;padding:13px 22px;margin-top:20px;font:inherit;cursor:pointer}small{display:block;margin-top:20px;color:#52627a}#error{color:#9e263c}</style></head><body><main><strong>XEROO DESK</strong><h1>Your shop, connected.</h1><p>Enter the shop address provided by your administrator. Then sign in with your own account.</p><form id="connect"><label for="address">Shop address</label><input id="address" required placeholder="krishna.techpickhub.shop" autocomplete="url"><button id="submit">Connect to shop</button></form><p id="error" role="alert"></p><small>After signing in, choose Shop → Register this computer to set up printing.</small></main><script src="connect.js"></script></body></html>
