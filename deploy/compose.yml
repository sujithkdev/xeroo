name: xeroo
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: xeroo
      POSTGRES_DB: xeroo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a database password}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U xeroo -d xeroo"]
      interval: 5s
      timeout: 5s
      retries: 12
  migrate:
    build: ..
    image: xeroo-server:local
    env_file: .env
    environment:
      DATABASE_URL: postgresql://xeroo:${POSTGRES_PASSWORD}@db:5432/xeroo
    command: [node, scripts/migrate.cjs]
    depends_on:
      db:
        condition: service_healthy
  app:
    image: xeroo-server:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://xeroo:${POSTGRES_PASSWORD}@db:5432/xeroo
      APP_DOMAIN: techpickhub.shop
      LOCAL_DB_MODE: "false"
      LOCAL_OPERATOR_MODE: "false"
      DATA_DIR: /app/data
    volumes:
      - documents:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
volumes:
  postgres:
  documents:
  caddy_data:
  caddy_config:
