name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: xeroo_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: xeroo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xeroo_test -d xeroo_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:priority
      - run: npm run test:scheduling
      - run: npm run test:desktop
      - run: npm run test:checkout
      - run: npm run test:fulfilment
      - run: npm run test:launch
      - run: npm test
      - run: node tests/integration-multishop.cjs
        env:
          DATABASE_URL: postgresql://xeroo_test:isolated_ci_only@127.0.0.1:5432/xeroo_test
      - run: npm audit --omit=dev
